<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iNat Tools: Trip Report</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.jade.min.css">
    <style>
        #map { height: 380px; margin: 1rem 0; }
    </style>
</head>
<body>
    <main>
        <hgroup>
            <h1>🍄 Trip Report</h1>
            <p>Every observation you made on one day, rarest first &mdash; lifers starred, and your route traced across the map.</p>
        </hgroup>

        <nav>
            <ul><li><a href="index.html">Home</a></li></ul>
        </nav>

        <form id="form">
            <fieldset role="group">
                <input type="text" id="observer" value="observer_sydney" placeholder="iNat username" aria-label="Observer">
                <input type="date" id="date" aria-label="Date">
                <button id="loadBtn">Load</button>
            </fieldset>
            <small id="status"></small>
        </form>

        <p id="summary"></p>
        <div id="map" hidden></div>

        <table>
            <thead>
                <tr><th>#</th><th></th><th>Taxon</th><th>Global obs</th><th>Status</th></tr>
            </thead>
            <tbody id="list"></tbody>
        </table>
    </main>

    <script type="module" src="../src/tripReport.view.ts"></script>
</body>
</html>
