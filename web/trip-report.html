<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>iNat Tools: Trip Report</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.jade.min.css">
    <style>
        #map { height: 380px; margin: 1rem 0; }

        /* First-time (lifer) marker: a gold circle + label, matching the map
         * markers and calendar. The label inherits the surrounding text colour
         * so it stays readable on both the dark page and the white map popup. */
        .lifer-badge { font-weight: 600; white-space: nowrap; }
        .lifer-dot { color: #facc15; }

        /* Custom calendar date picker, styled to read like an ordinary month
         * calendar (circular day cells, quiet chrome). Lifer days are gold and
         * days with observations blue, matching the map markers. */
        #calendar { margin: 0 0 1rem; max-width: 20rem; }
        .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: .4rem; }
        .cal-nav strong { font-size: .95rem; }
        .cal-nav button {
            all: unset; cursor: pointer; padding: .1rem .55rem; border-radius: 6px;
            font-size: 1.15rem; line-height: 1;
        }
        .cal-nav button:hover:not(:disabled) { background: rgba(127, 127, 127, .18); }
        .cal-nav button:disabled { opacity: .3; cursor: default; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
        .cal-head { text-align: center; font-size: .7rem; opacity: .55; padding: .25rem 0; }
        .cal-pad { aspect-ratio: 1; }
        .cal-day {
            all: unset; box-sizing: border-box; cursor: pointer;
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; font-size: .85rem; line-height: 1; transition: background .12s;
        }
        .cal-day:hover:not(:disabled) { background: rgba(127, 127, 127, .18); }
        .cal-day:focus-visible { outline: 2px solid #34d399; outline-offset: -2px; }
        .cal-day:disabled { opacity: .3; cursor: default; }
        .cal-day.obs   { background: #60a5fa; color: #0b1220; }
        .cal-day.lifer { background: #facc15; color: #1a1400; }
        .cal-day.selected { box-shadow: 0 0 0 2px #34d399; }
        .cal-legend { display: flex; gap: 1rem; margin-top: .6rem; align-items: center; opacity: .85; }
        .cal-legend .swatch { display: inline-block; width: .8rem; height: .8rem; border-radius: 50%; vertical-align: middle; margin-right: .3rem; }
        .cal-legend .swatch.lifer { background: #facc15; }
        .cal-legend .swatch.obs { background: #60a5fa; }
    </style>
</head>
<body>
    <main>
        <hgroup>
            <h1>🍄 Trip Report</h1>
            <p>Every observation you made on one day, rarest first &mdash; lifers starred, and your route traced across the map.</p>
        </hgroup>

        <nav>
            <ul><li><a href="index.html">Home</a></li></ul>
        </nav>

        <form id="form">
            <fieldset role="group">
                <input type="text" id="observer" value="observer_sydney" placeholder="iNat username" aria-label="Observer">
                <button id="loadBtn">Load</button>
            </fieldset>
            <small id="status"></small>
        </form>

        <div id="calendar">
            <div class="cal-nav">
                <button id="prevMonth" type="button" aria-label="Previous month">‹</button>
                <strong id="calMonth"></strong>
                <button id="nextMonth" type="button" aria-label="Next month">›</button>
            </div>
            <div id="calGrid" class="cal-grid"></div>
            <small class="cal-legend">
                <span><span class="swatch lifer"></span>lifer day</span>
                <span><span class="swatch obs"></span>observations</span>
            </small>
        </div>

        <p id="summary"></p>
        <div id="map" hidden></div>

        <table>
            <thead>
                <tr><th>#</th><th></th><th>Taxon</th><th>Global obs</th><th>Status</th></tr>
            </thead>
            <tbody id="list"></tbody>
        </table>
    </main>

    <script type="module" src="../src/tripReport.view.ts"></script>
</body>
</html>
