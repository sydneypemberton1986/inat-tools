<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iNat Tools: Rarest</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.jade.min.css">
</head>
<body>
    <main>
        <hgroup>
            <h1>Rarest Observations</h1>
            <p>Your observations, ranked by how few observations of that taxon exist on iNaturalist worldwide &mdash; the rarest things you have seen.</p>
        </hgroup>

        <nav>
            <ul><li><a href="index.html">Home</a></li></ul>
        </nav>

        <form id="form">
            <fieldset role="group">
                <input type="text" id="observer" value="observer_sydney" placeholder="iNat username" aria-label="Observer">
                <button id="loadBtn">Load</button>
            </fieldset>
            <small id="status"></small>
        </form>

        <table>
            <thead>
                <tr><th>#</th><th></th><th>Taxon</th><th>Global obs</th><th>Status</th></tr>
            </thead>
            <tbody id="list"></tbody>
        </table>
    </main>

    <script type="module" src="/src/rarest.view.ts"></script>
</body>
</html>
